version: "3.9"

services:
  credit-risk-app:
    build: .
    container_name: neostats_credit_risk
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/models
      - DB_PATH=/app/data/credit_risk.db
    volumes:
      # Mount your Kaggle dataset directory here
      - ./data:/app/data
      # Persist trained models
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
